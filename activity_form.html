{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4">
<h2 class="mb-4">Tambah Kegiatan PKL</h2>
<form method="post" enctype="multipart/form-data">
<label class="form-label">Tanggal</label><input type="date" name="activity_date" value="{{today}}" class="form-control mb-3" required>
<label class="form-label">Nama kegiatan</label><input name="title" class="form-control mb-3" placeholder="Contoh: Monitoring jaringan" required>
<label class="form-label">Deskripsi</label><textarea name="description" class="form-control mb-3" rows="5" placeholder="Jelaskan kegiatan yang dilakukan..." required></textarea>
<label class="form-label">Status</label><select name="status" class="form-select mb-3"><option>Selesai</option><option>Diproses</option><option>Belum</option></select>
<label class="form-label">Foto dokumentasi</label><input type="file" name="photo" accept=".png,.jpg,.jpeg,.webp" class="form-control mb-4">
<button class="btn btn-primary">Simpan Kegiatan</button> <a href="/activities" class="btn btn-secondary">Batal</a>
</form></div></div></div>
{% endblock %}
