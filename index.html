<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PKLTrack — Logbook PKL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e1a'/%3E%3Cpath d='M6 22 12 14 17 18 26 8' stroke='%2338bdf8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ============================================================
   PKLTrack — design tokens
   Tema: logbook pemantauan lapangan (network / IT monitoring),
   kontras tinggi agar nyaman dibaca di kelas / lab.
   ============================================================ */
:root{
  --bg: #090d16;
  --bg-soft: #0d1220;
  --surface: #121a2b;
  --surface-hover: #182238;
  --border: #24304a;
  --border-strong: #34456b;

  --text: #f3f6fc;
  --text-muted: #aab6d4;
  --text-faint: #6d7ba0;

  --accent: #4cc3ff;
  --accent-strong: #1ea1f0;
  --accent-soft: rgba(76, 195, 255, .12);

  --ok: #35d399;
  --ok-soft: rgba(53, 211, 153, .14);
  --warn: #f6b93b;
  --warn-soft: rgba(246, 185, 59, .14);
  --bad: #ff6b7f;
  --bad-soft: rgba(255, 107, 127, .14);

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;

  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;

  --shadow-card: 0 1px 0 rgba(255,255,255,.02) inset, 0 10px 24px -18px rgba(0,0,0,.6);
}

*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background:
    radial-gradient(circle at 14px 14px, rgba(76,195,255,.05) 1px, transparent 1.4px) 0 0/28px 28px,
    var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
h1,h2,h3,h4,h5{
  font-family: var(--font-ui);
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0;
}
p{ margin: 0; }
a{ color: inherit; text-decoration: none; }
button{ font-family: inherit; }
::selection{ background: var(--accent-soft); color: var(--text); }

/* ---------- Layout shell ---------- */
.shell{
  display: grid;
  grid-template-columns: 236px 1fr;
  min-height: 100vh;
}
.sidebar{
  border-right: 1px solid var(--border);
  background: var(--bg-soft);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 26px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 14px;
  border-bottom: 1px solid var(--border);
}
.brand-mark{
  width: 30px; height: 30px;
  border-radius: 8px;
  background: linear-gradient(155deg, var(--accent), #1c6fa8);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-mark svg{ width: 16px; height: 16px; }
.brand-text{ display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong{ font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
.brand-text span{ font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }

.nav{ display: flex; flex-direction: column; gap: 3px; }
.nav-label{
  font-size: 11px;
  color: var(--text-faint);
  padding: 0 10px;
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.nav a{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  transition: background .12s ease, color .12s ease;
}
.nav a svg{ width: 16px; height: 16px; opacity: .85; flex-shrink: 0; }
.nav a:hover{ background: var(--surface-hover); color: var(--text); }
.nav a.active{
  background: var(--accent-soft);
  color: var(--accent);
}
.nav a.active svg{ opacity: 1; }

.sidebar-foot{
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pdf-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.pdf-btn:hover{ border-color: var(--accent); background: var(--surface-hover); }
.pdf-btn svg{ width: 15px; height: 15px; }
.meta-line{
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  text-align: center;
}

.main{ padding: 26px 32px 60px; min-width: 0; }
.topbar{
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.topbar h1{ font-size: 22px; }
.topbar .sub{ color: var(--text-muted); font-size: 13.5px; margin-top: 4px; }
.btn{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid transparent;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn svg{ width: 15px; height: 15px; }
.btn-primary{ background: var(--accent); color: #06182a; }
.btn-primary:hover{ background: var(--accent-strong); }
.btn-ghost{ background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
.btn-ghost:hover{ color: var(--text); border-color: var(--accent); }
.btn-danger{ background: transparent; color: var(--bad); border-color: rgba(255,107,127,.35); }
.btn-danger:hover{ background: var(--bad-soft); }
.btn-sm{ padding: 6px 11px; font-size: 12.5px; }

/* ---------- Flash ---------- */
#flash{ margin-bottom: 16px; }
.alert{
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  border: 1px solid;
  display: flex;
  align-items: center;
  gap: 8px;
}
.alert-success{ background: var(--ok-soft); color: var(--ok); border-color: rgba(53,211,153,.3); }
.alert-danger{ background: var(--bad-soft); color: var(--bad); border-color: rgba(255,107,127,.3); }

/* ---------- Stat cards ---------- */
.stat-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.stat-card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
}
.stat-card .label{ font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
.stat-card .value{
  font-family: var(--font-mono);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.stat-card .value.ok{ color: var(--ok); }
.stat-card .value.warn{ color: var(--warn); }
.stat-card .value.accent{ color: var(--accent); }

/* ---------- Generic panels ---------- */
.grid-2{ display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
.panel{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-card);
}
.panel-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.panel-head h3{ font-size: 14.5px; }
.panel-head a{ font-size: 12.5px; color: var(--accent); font-weight: 600; }

/* ---------- Competency rows ---------- */
.comp-row{ margin-bottom: 16px; }
.comp-row:last-child{ margin-bottom: 0; }
.comp-top{ display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; }
.comp-top .name{ font-weight: 600; }
.comp-top .pct{ font-family: var(--font-mono); color: var(--text-muted); }
.comp-desc{ font-size: 12px; color: var(--text-faint); margin-bottom: 7px; }
.bar{ height: 7px; border-radius: 99px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
.bar-fill{ height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-strong), var(--accent)); }
.update-form{ display: flex; gap: 8px; margin-top: 9px; }
.update-form input[type=number]{ width: 84px; }

/* ---------- Table ---------- */
.table-wrap{ overflow-x: auto; }
table{ width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th{
  text-align: left;
  font-size: 11.5px;
  color: var(--text-faint);
  font-weight: 600;
  padding: 0 12px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td{
  padding: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text);
}
tbody tr:last-child td{ border-bottom: none; }
tbody tr:hover{ background: var(--surface-hover); }
td.date, td.num{ font-family: var(--font-mono); color: var(--text-muted); font-size: 12.5px; }
.thumb{ width: 46px; height: 46px; object-fit: cover; border-radius: 7px; border: 1px solid var(--border-strong); }
.empty-cell{ color: var(--text-faint); text-align: center; padding: 30px 12px; }

/* ---------- Status badge ---------- */
.badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px 4px 7px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-mono);
}
.badge .dot{ width: 6px; height: 6px; border-radius: 99px; }
.badge.ok{ background: var(--ok-soft); color: var(--ok); }
.badge.ok .dot{ background: var(--ok); }
.badge.warn{ background: var(--warn-soft); color: var(--warn); }
.badge.warn .dot{ background: var(--warn); }
.badge.bad{ background: var(--bad-soft); color: var(--bad); }
.badge.bad .dot{ background: var(--bad); }

/* ---------- Forms ---------- */
.form-card{ max-width: 620px; }
.field{ margin-bottom: 16px; }
.field label{
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 7px;
}
.field .hint{ font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }
input, select, textarea{
  width: 100%;
  background: var(--bg-soft);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13.5px;
  font-family: var(--font-ui);
  outline: none;
  transition: border-color .12s ease, box-shadow .12s ease;
}
input::placeholder, textarea::placeholder{ color: var(--text-faint); }
input:focus, select:focus, textarea:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea{ resize: vertical; min-height: 110px; font-family: var(--font-ui); }
input[type=file]{ padding: 8px 10px; cursor: pointer; }
input[type=date], input[type=number]{ font-family: var(--font-mono); }
.form-actions{ display: flex; gap: 10px; margin-top: 4px; }

/* ---------- Empty state ---------- */
.empty-state{
  text-align: center;
  padding: 46px 20px;
  color: var(--text-muted);
}
.empty-state svg{ width: 34px; height: 34px; color: var(--text-faint); margin-bottom: 12px; }
.empty-state p{ font-size: 13.5px; margin-bottom: 16px; }

/* ---------- Chart card ---------- */
.chart-wrap{ position: relative; height: 230px; }

/* ---------- Mobile ---------- */
@media (max-width: 920px){
  .shell{ grid-template-columns: 1fr; }
  .sidebar{
    position: static;
    height: auto;
    flex-direction: row;
    align-items: center;
    padding: 12px 16px;
    gap: 14px;
    overflow-x: auto;
  }
  .brand{ border-bottom: none; padding: 0; }
  .nav{ flex-direction: row; }
  .nav-label{ display: none; }
  .sidebar-foot{ margin-top: 0; border-top: none; padding-top: 0; flex-direction: row; }
  .meta-line{ display: none; }
  .main{ padding: 20px 18px 50px; }
  .stat-grid{ grid-template-columns: repeat(2, 1fr); }
  .grid-2{ grid-template-columns: 1fr; }
}
@media (max-width: 520px){
  .stat-grid{ grid-template-columns: 1fr 1fr; }
  .stat-card .value{ font-size: 24px; }
}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06182a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 9 13 13 21 4"/></svg>
      </div>
      <div class="brand-text">
        <strong>PKLTrack</strong>
        <span>logbook.local</span>
      </div>
    </div>

    <nav class="nav" id="mainNav">
      <span class="nav-label">MENU</span>
      <a href="#/" data-route="#/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="#/activities" data-route="#/activities">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4"/><circle cx="4.5" cy="12" r="1.4"/><circle cx="4.5" cy="18" r="1.4"/></svg>
        Kegiatan
      </a>
      <a href="#/competencies" data-route="#/competencies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        Kompetensi
      </a>
    </nav>

    <div class="sidebar-foot">
      <button class="pdf-btn" id="exportPdfBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Export laporan PDF
      </button>
      <span class="meta-line" id="storageInfo">data tersimpan lokal</span>
    </div>
  </aside>

  <main class="main">
    <div id="flash"></div>
    <div id="app"></div>
  </main>
</div>

<script>
/* ============================================================
   PKLTrack — static edition
   Konversi dari aplikasi Flask + SQLite menjadi aplikasi satu-file
   yang berjalan penuh di browser (cocok untuk GitHub Pages).
   Penyimpanan data memakai localStorage, dibungkus lewat sebuah
   lapisan "store" kecil supaya sisa kode tidak perlu tahu detailnya.
   ============================================================ */

// ---------------------------------------------------------------
// 1. STORE — pembungkus localStorage
// ---------------------------------------------------------------
const STORE_KEYS = {
  activities: "pkltrack_activities",
  competencies: "pkltrack_competencies"
};

const DEFAULT_COMPETENCIES = [
  { id: 1, name: "Monitoring jaringan", description: "Memantau koneksi dan aplikasi jaringan", progress: 80 },
  { id: 2, name: "Konfigurasi perangkat", description: "Mempelajari konfigurasi perangkat jaringan", progress: 60 },
  { id: 3, name: "Troubleshooting", description: "Menganalisis dan menangani gangguan", progress: 70 },
  { id: 4, name: "Dokumentasi teknis", description: "Membuat catatan dan laporan kegiatan", progress: 90 }
];

const Store = {
  getActivities(){
    return JSON.parse(localStorage.getItem(STORE_KEYS.activities) || "[]");
  },
  setActivities(list){
    localStorage.setItem(STORE_KEYS.activities, JSON.stringify(list));
  },
  getCompetencies(){
    const raw = localStorage.getItem(STORE_KEYS.competencies);
    if(!raw){
      localStorage.setItem(STORE_KEYS.competencies, JSON.stringify(DEFAULT_COMPETENCIES));
      return DEFAULT_COMPETENCIES.slice();
    }
    return JSON.parse(raw);
  },
  setCompetencies(list){
    localStorage.setItem(STORE_KEYS.competencies, JSON.stringify(list));
  },
  nextId(list){
    return list.length ? Math.max(...list.map(x => x.id)) + 1 : 1;
  }
};

// ---------------------------------------------------------------
// 2. HELPERS
// ---------------------------------------------------------------
function escapeHtml(str){
  const div = document.createElement("div");
  div.innerText = str == null ? "" : str;
  return div.innerHTML;
}

function formatDateShort(iso){
  if(!iso) return "-";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}-${m}-${y}`;
}

function flash(message, category){
  const el = document.getElementById("flash");
  el.innerHTML = `<div class="alert alert-${category}">${escapeHtml(message)}</div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.innerHTML = ""; }, 3800);
}

function statusBadge(status){
  const map = {
    "Selesai": { cls: "ok", label: "Selesai" },
    "Diproses": { cls: "warn", label: "Diproses" },
    "Belum": { cls: "bad", label: "Belum" }
  };
  const s = map[status] || { cls: "warn", label: status };
  return `<span class="badge ${s.cls}"><span class="dot"></span>${escapeHtml(s.label)}</span>`;
}

function iconEmpty(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`;
}

// ---------------------------------------------------------------
// 3. CHART instance tracker (Chart.js keeps state between renders)
// ---------------------------------------------------------------
let statusChart = null;

// ---------------------------------------------------------------
// 4. VIEWS
// ---------------------------------------------------------------
function viewDashboard(){
  const activities = Store.getActivities();
  const competencies = Store.getCompetencies();

  const total = activities.length;
  const done = activities.filter(a => a.status === "Selesai").length;
  const process = activities.filter(a => a.status === "Diproses").length;
  const pending = activities.filter(a => a.status === "Belum").length;
  const avgComp = competencies.length
    ? Math.round(competencies.reduce((sum, c) => sum + c.progress, 0) / competencies.length)
    : 0;

  const recent = [...activities]
    .sort((a, b) => (b.activity_date + b.id).localeCompare(a.activity_date + a.id))
    .slice(0, 5);

  const compHtml = competencies.length
    ? competencies.map(c => `
      <div class="comp-row">
        <div class="comp-top"><span class="name">${escapeHtml(c.name)}</span><span class="pct">${c.progress}%</span></div>
        <div class="bar"><div class="bar-fill" style="width:${c.progress}%"></div></div>
      </div>
    `).join("")
    : `<div class="empty-state"><p>Belum ada kompetensi tercatat.</p></div>`;

  const rowsHtml = recent.length
    ? recent.map(a => `
      <tr>
        <td class="date">${formatDateShort(a.activity_date)}</td>
        <td>${escapeHtml(a.title)}</td>
        <td>${statusBadge(a.status)}</td>
      </tr>
    `).join("")
    : `<tr><td colspan="3" class="empty-cell">Belum ada kegiatan yang tercatat.</td></tr>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Dashboard PKL</h1>
        <p class="sub">Ringkasan kegiatan dan perkembangan kompetensi selama praktik kerja lapangan.</p>
      </div>
      <a href="#/activities/add" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Tambah kegiatan
      </a>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total kegiatan</div><div class="value">${total}</div></div>
      <div class="stat-card"><div class="label">Selesai</div><div class="value ok">${done}</div></div>
      <div class="stat-card"><div class="label">Diproses</div><div class="value warn">${process}</div></div>
      <div class="stat-card"><div class="label">Rata-rata kompetensi</div><div class="value accent">${avgComp}%</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Distribusi status kegiatan</h3></div>
        <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Progres kompetensi</h3></div>
        ${compHtml}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Kegiatan terbaru</h3>
        <a href="#/activities">Lihat semua &rsaquo;</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Status</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;

  if(statusChart) statusChart.destroy();
  const ctx = document.getElementById("statusChart");
  statusChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Selesai", "Diproses", "Belum"],
      datasets: [{
        data: [done, process, pending],
        backgroundColor: ["#35d399", "#f6b93b", "#ff6b7f"],
        borderColor: "#121a2b",
        borderWidth: 3
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: { color: "#aab6d4", font: { family: "Inter", size: 12.5 }, padding: 16, boxWidth: 10 }
        }
      }
    }
  });
}

function viewActivities(){
  const activities = [...Store.getActivities()]
    .sort((a, b) => (b.activity_date + b.id).localeCompare(a.activity_date + a.id));

  const rows = activities.length
    ? activities.map(a => {
        const desc = a.description.length > 70
          ? escapeHtml(a.description.slice(0, 70)) + "…"
          : escapeHtml(a.description);
        const photo = a.photo
          ? `<img src="${a.photo}" class="thumb" alt="Dokumentasi ${escapeHtml(a.title)}">`
          : `<span class="empty-cell" style="padding:0;">—</span>`;
        return `
          <tr>
            <td class="date">${formatDateShort(a.activity_date)}</td>
            <td>${escapeHtml(a.title)}</td>
            <td style="color:var(--text-muted)">${desc}</td>
            <td>${statusBadge(a.status)}</td>
            <td>${photo}</td>
            <td><button class="btn btn-danger btn-sm" onclick="Actions.deleteActivity(${a.id})">Hapus</button></td>
          </tr>`;
      }).join("")
    : `<tr><td colspan="6" class="empty-cell">Belum ada kegiatan yang tercatat.</td></tr>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Kegiatan harian</h1>
        <p class="sub">${activities.length} kegiatan tercatat sejauh ini.</p>
      </div>
      <a href="#/activities/add" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Tambah kegiatan
      </a>
    </div>
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Deskripsi</th><th>Status</th><th>Foto</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function viewActivityForm(){
  const today = new Date().toISOString().slice(0, 10);

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Tambah kegiatan PKL</h1>
        <p class="sub">Catat apa yang kamu kerjakan hari ini.</p>
      </div>
    </div>
    <div class="panel form-card">
      <form id="activityForm">
        <div class="field">
          <label for="f_date">Tanggal</label>
          <input id="f_date" type="date" name="activity_date" value="${today}" required>
        </div>
        <div class="field">
          <label for="f_title">Nama kegiatan</label>
          <input id="f_title" name="title" placeholder="Contoh: Monitoring jaringan" required>
        </div>
        <div class="field">
          <label for="f_desc">Deskripsi</label>
          <textarea id="f_desc" name="description" placeholder="Jelaskan kegiatan yang dilakukan..." required></textarea>
        </div>
        <div class="field">
          <label for="f_status">Status</label>
          <select id="f_status" name="status">
            <option>Selesai</option>
            <option>Diproses</option>
            <option>Belum</option>
          </select>
        </div>
        <div class="field">
          <label for="f_photo">Foto dokumentasi</label>
          <input id="f_photo" type="file" name="photo" accept=".png,.jpg,.jpeg,.webp">
          <p class="hint">Opsional. Format PNG, JPG, JPEG, atau WEBP.</p>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Simpan kegiatan</button>
          <a href="#/activities" class="btn btn-ghost">Batal</a>
        </div>
      </form>
    </div>

  document.getElementById("activityForm").addEventListener("submit", Actions.submitActivity);

function viewCompetencies(){
  const competencies = Store.getCompetencies();

  const listHtml = competencies.length
    ? competencies.map(c => `
      <div class="comp-row">
        <div class="comp-top"><span class="name">${escapeHtml(c.name)}</span><span class="pct">${c.progress}%</span></div>
        <div class="comp-desc">${escapeHtml(c.description || "")}</div>
        <div class="bar"><div class="bar-fill" style="width:${c.progress}%"></div></div>
        <form class="update-form" data-id="${c.id}" onsubmit="Actions.updateCompetency(event)">
          <input type="number" min="0" max="100" name="progress" value="${c.progress}">
          <button class="btn btn-ghost btn-sm" type="submit">Update</button>
        </form>
      </div>
    `).join("")
    : `<div class="empty-state">${iconEmpty()}<p>Belum ada kompetensi tercatat.</p></div>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Kompetensi PKL</h1>
        <p class="sub">Catat kemampuan yang sudah kamu pelajari selama praktik.</p>
      </div>
    </div>
    <div class="grid-2">
      <div class="panel">${listHtml}</div>
      <div class="panel">
        <div class="panel-head"><h3>Tambah kompetensi</h3></div>
        <form id="addCompForm">
          <div class="field">
            <label for="c_name">Nama kompetensi</label>
            <input id="c_name" name="name" placeholder="Contoh: Instalasi kabel jaringan" required>
          </div>
          <div class="field">
            <label for="c_desc">Deskripsi</label>
            <textarea id="c_desc" name="description" placeholder="Deskripsi singkat"></textarea>
          </div>
          <div class="field">
            <label for="c_progress">Progres awal (%)</label>
            <input id="c_progress" type="number" name="progress" min="0" max="100" value="0">
          </div>
          <button class="btn btn-primary" type="submit">Tambah kompetensi</button>
        </form>
      </div>
    </div>
  `;

  document.getElementById("addCompForm").addEventListener("submit", Actions.addCompetency);
}

// ---------------------------------------------------------------
// 5. ACTIONS — mutate the store, then re-render
// ---------------------------------------------------------------
const Actions = {
  deleteActivity(id){
    if(!confirm("Hapus kegiatan ini?")) return;
    const list = Store.getActivities().filter(a => a.id !== id);
    Store.setActivities(list);
    flash("Kegiatan dihapus.", "success");
    viewActivities();
  },

  submitActivity(e){
    e.preventDefault();
    const form = e.target;
    const activity_date = form.activity_date.value;
    const title = form.title.value.trim();
    const description = form.description.value.trim();
    const status = form.status.value;
    const file = form.photo.files[0];
    const allowedExt = ["png", "jpg", "jpeg", "webp"];

    function persist(photoDataUrl){
      const list = Store.getActivities();
      list.push({
        id: Store.nextId(list),
        activity_date, title, description, status,
        photo: photoDataUrl || null,
        created_at: new Date().toISOString()
      });
      Store.setActivities(list);
      flash("Kegiatan berhasil ditambahkan.", "success");
      location.hash = "#/activities";
    }

    if(file){
      const ext = file.name.split(".").pop().toLowerCase();
      if(!allowedExt.includes(ext)){
        flash("Format foto harus PNG, JPG, JPEG, atau WEBP.", "danger");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => persist(reader.result);
      reader.readAsDataURL(file);
    } else {
      persist(null);
    }
  },

  updateCompetency(e){
    e.preventDefault();
    const form = e.target;
    const id = parseInt(form.dataset.id, 10);
    let progress = parseInt(form.progress.value, 10) || 0;
    progress = Math.max(0, Math.min(100, progress));
    const list = Store.getCompetencies();
    const item = list.find(c => c.id === id);
    if(item) item.progress = progress;
    Store.setCompetencies(list);
    flash("Progres diperbarui.", "success");
    viewCompetencies();
  },

  addCompetency(e){
    e.preventDefault();
    const form = e.target;
    const name = form.name.value.trim();
    const description = form.description.value.trim();
    let progress = parseInt(form.progress.value, 10) || 0;
    progress = Math.max(0, Math.min(100, progress));
    if(!name) return;
    const list = Store.getCompetencies();
    list.push({ id: Store.nextId(list), name, description, progress });
    Store.setCompetencies(list);
    flash("Kompetensi ditambahkan.", "success");
    viewCompetencies();
  }
};

// ---------------------------------------------------------------
// 6. PDF EXPORT
// ---------------------------------------------------------------
function exportPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "cm", format: "a4" });
  const activities = [...Store.getActivities()].sort((a, b) => b.activity_date.localeCompare(a.activity_date));
  const competencies = Store.getCompetencies();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = 2;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.text("PKLTrack — Laporan Dokumentasi PKL", 2, y);
  y += 0.8;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  doc.text(`Dibuat pada: ${stamp}`, 2, y);
  y += 1.2;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.text("Daftar Kompetensi", 2, y);
  y += 0.6;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  competencies.forEach(item => {
    doc.text(`- ${item.name}: ${item.progress}%`, 2.2, y);
    y += 0.45;
  });

  y += 0.4;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.text("Kegiatan PKL", 2, y);
  y += 0.6;
  doc.setFontSize(9);

  if(activities.length === 0){
    doc.setFont("helvetica", "normal");
    doc.text("Belum ada kegiatan yang tercatat.", 2.2, y);
  }

  activities.forEach(item => {
    if(y > pageHeight - 3){
      doc.addPage();
      y = 2;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
    }
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text(`${item.activity_date} | ${item.title} | ${item.status}`, 2.2, y);
    y += 0.4;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    const description = item.description || "";
    for(let i = 0; i < description.length; i += 95){
      if(y > pageHeight - 2){
        doc.addPage();
        y = 2;
      }
      doc.text(description.slice(i, i + 95), 2.5, y);
      y += 0.35;
    }
    y += 0.25;
  });

  doc.save("laporan_pkltrack.pdf");
}
document.getElementById("exportPdfBtn").addEventListener("click", exportPdf);

// ---------------------------------------------------------------
// 7. ROUTER
// ---------------------------------------------------------------
const ROUTES = {
  "#/": viewDashboard,
  "#/activities": viewActivities,
  "#/activities/add": viewActivityForm,
  "#/competencies": viewCompetencies
};

function setActiveNav(hash){
  document.querySelectorAll("#mainNav a").forEach(a => {
    a.classList.toggle("active", a.dataset.route === hash);
  });
}

function route(){
  const hash = location.hash || "#/";
  const view = ROUTES[hash] || viewDashboard;
  const navHash = hash === "#/activities/add" ? "#/activities" : hash;
  setActiveNav(navHash);
  view();
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
</script>
