<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PKLTrack — Logbook PKL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304060c'/%3E%3Cpath d='M6 22 12 14 17 18 26 8' stroke='%2333e0ff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ============================================================
   PKLTrack — design tokens
   Tema: konsol digital / robotic monitoring, dibangun di atas
   nuansa "network operations" yang sudah ada — bracket ala HUD,
   tipografi geometris untuk angka, data mono, dan glow tipis
   pada elemen aktif. Kontras tetap tinggi untuk dibaca lama.
   ============================================================ */
:root{
  --bg: #04060c;
  --bg-soft: #070a13;
  --surface: #0d1220;
  --surface-hover: #141c30;
  --border: #1b2439;
  --border-strong: #2b3a5c;

  --text: #eef2fb;
  --text-muted: #9caed2;
  --text-faint: #5b6786;

  --accent: #33e0ff;
  --accent-strong: #00b7e0;
  --accent-soft: rgba(51, 224, 255, .12);
  --accent-2: #8b5cf6;
  --accent-2-soft: rgba(139, 92, 246, .14);

  --ok: #2ee6a6;
  --ok-soft: rgba(46, 230, 166, .14);
  --warn: #ffb547;
  --warn-soft: rgba(255, 181, 71, .14);
  --bad: #ff5577;
  --bad-soft: rgba(255, 85, 119, .14);

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;

  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  --font-head: 'Rajdhani', var(--font-ui);
  --font-display: 'Orbitron', var(--font-head);
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;

  --shadow-card: 0 1px 0 rgba(255,255,255,.02) inset, 0 10px 28px -18px rgba(0,0,0,.7);
  --glow-accent: 0 0 0 1px rgba(51,224,255,.08), 0 0 22px -6px rgba(51,224,255,.35);
}

*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  position: relative;
  background:
    radial-gradient(circle at 14px 14px, rgba(51,224,255,.055) 1px, transparent 1.4px) 0 0/28px 28px,
    radial-gradient(ellipse 900px 520px at 8% -6%, rgba(51,224,255,.08), transparent 60%),
    radial-gradient(ellipse 800px 480px at 96% 8%, rgba(139,92,246,.07), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  overflow-x: hidden;
}
h1,h2,h3,h4,h5{
  font-family: var(--font-head);
  font-weight: 700;
  letter-spacing: -.005em;
  margin: 0;
}
p{ margin: 0; }
a{ color: inherit; text-decoration: none; }
button{ font-family: inherit; }
::selection{ background: var(--accent-soft); color: var(--text); }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Ambient scanline (single deliberate motion cue) ---------- */
#scanline{
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: linear-gradient(to bottom, transparent 0%, rgba(51,224,255,.05) 48%, transparent 100%);
  height: 220px;
  animation: scan 9s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan{
  0%{ transform: translateY(-220px); opacity: 0; }
  8%{ opacity: 1; }
  92%{ opacity: 1; }
  100%{ transform: translateY(100vh); opacity: 0; }
}
@media (prefers-reduced-motion: reduce){
  #scanline{ display: none; }
}

/* ---------- Layout shell ---------- */
.shell{
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}
.sidebar{
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, var(--bg-soft), #060811);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 26px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand{
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 2px 6px 16px;
  border-bottom: 1px solid var(--border);
}
.brand-mark{
  width: 32px; height: 32px;
  border-radius: 9px;
  background: linear-gradient(155deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 18px -4px rgba(51,224,255,.65);
}
.brand-mark svg{ width: 17px; height: 17px; }
.brand-text{ display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong{
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700; letter-spacing: .01em;
}
.brand-text span{
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono);
}
.pulse-dot{
  width: 6px; height: 6px; border-radius: 99px;
  background: var(--ok);
  box-shadow: 0 0 8px 1px var(--ok);
  animation: pulse 2.2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulse{
  0%, 100%{ opacity: 1; transform: scale(1); }
  50%{ opacity: .45; transform: scale(.8); }
}
@media (prefers-reduced-motion: reduce){ .pulse-dot{ animation: none; } }

.nav{ display: flex; flex-direction: column; gap: 3px; }
.nav-label{
  font-size: 10.5px;
  color: var(--text-faint);
  padding: 0 10px;
  margin-bottom: 6px;
  font-family: var(--font-mono);
  letter-spacing: .06em;
}
.nav a{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 14.5px;
  font-weight: 600;
  font-family: var(--font-head);
  letter-spacing: .01em;
  border-left: 2px solid transparent;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.nav a svg{ width: 16px; height: 16px; opacity: .85; flex-shrink: 0; }
.nav a:hover{ background: var(--surface-hover); color: var(--text); }
.nav a.active{
  background: var(--accent-soft);
  color: var(--accent);
  border-left-color: var(--accent);
}
.nav a.active svg{ opacity: 1; filter: drop-shadow(0 0 5px rgba(51,224,255,.6)); }

.sidebar-foot{
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pdf-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-head);
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease, box-shadow .12s ease;
}
.pdf-btn:hover{ border-color: var(--accent); background: var(--surface-hover); box-shadow: var(--glow-accent); }
.pdf-btn svg{ width: 15px; height: 15px; }
.meta-line{
  display: flex; align-items: center; gap: 7px; justify-content: center;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}

.main{ padding: 26px 32px 60px; min-width: 0; position: relative; z-index: 1; }
.topbar{
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.topbar h1{ font-size: 25px; }
.topbar .sub{ color: var(--text-muted); font-size: 13.5px; margin-top: 5px; }
.btn{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid transparent;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-head);
  letter-spacing: .01em;
  cursor: pointer;
  white-space: nowrap;
  transition: box-shadow .15s ease, background .15s ease, border-color .15s ease, transform .08s ease;
}
.btn:active{ transform: translateY(1px); }
.btn svg{ width: 15px; height: 15px; }
.btn-primary{ background: var(--accent); color: #04141f; box-shadow: 0 0 0 1px rgba(51,224,255,.2), 0 10px 22px -12px rgba(51,224,255,.7); }
.btn-primary:hover{ background: var(--accent-strong); box-shadow: 0 0 0 1px rgba(51,224,255,.35), 0 0 26px -4px rgba(51,224,255,.8); }
.btn-ghost{ background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
.btn-ghost:hover{ color: var(--text); border-color: var(--accent); box-shadow: var(--glow-accent); }
.btn-danger{ background: transparent; color: var(--bad); border-color: rgba(255,85,119,.35); }
.btn-danger:hover{ background: var(--bad-soft); box-shadow: 0 0 18px -6px rgba(255,85,119,.6); }
.btn-sm{ padding: 6px 11px; font-size: 12.5px; }

/* ---------- Flash ---------- */
#flash{ margin-bottom: 16px; }
.alert{
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-family: var(--font-mono);
  border: 1px solid;
  display: flex;
  align-items: center;
  gap: 8px;
}
.alert-success{ background: var(--ok-soft); color: var(--ok); border-color: rgba(46,230,166,.3); }
.alert-danger{ background: var(--bad-soft); color: var(--bad); border-color: rgba(255,85,119,.3); }

/* ---------- HUD corner brackets, shared by panels/stat cards ---------- */
.panel, .stat-card{ position: relative; }
.panel::before, .panel::after, .stat-card::before, .stat-card::after{
  content: ""; position: absolute; width: 11px; height: 11px;
  opacity: .5; transition: opacity .2s ease, width .2s ease, height .2s ease;
  pointer-events: none;
}
.panel::before, .stat-card::before{ top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); border-top-left-radius: 5px; }
.panel::after, .stat-card::after{ bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); border-bottom-right-radius: 5px; }
.panel:hover::before, .panel:hover::after,
.stat-card:hover::before, .stat-card:hover::after{ opacity: 1; width: 15px; height: 15px; }

/* ---------- Stat cards ---------- */
.stat-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.stat-card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.stat-card.k-total{ border-top-color: var(--accent); }
.stat-card.k-ok{ border-top-color: var(--ok); }
.stat-card.k-warn{ border-top-color: var(--warn); }
.stat-card.k-violet{ border-top-color: var(--accent-2); }
.stat-card .label{
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--text-muted); margin-bottom: 12px;
  font-family: var(--font-mono); letter-spacing: .02em;
}
.stat-card .label .dot{ width: 5px; height: 5px; border-radius: 99px; background: currentColor; flex-shrink: 0; }
.stat-card .value{
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.stat-card .value.ok{ color: var(--ok); text-shadow: 0 0 18px rgba(46,230,166,.35); }
.stat-card .value.warn{ color: var(--warn); text-shadow: 0 0 18px rgba(255,181,71,.35); }
.stat-card .value.accent{ color: var(--accent-2); text-shadow: 0 0 18px rgba(139,92,246,.4); }

/* ---------- Generic panels ---------- */
.grid-2{ display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
.panel{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-card);
}
.panel-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.panel-head h3{ font-size: 15.5px; }
.panel-head a{ font-size: 12.5px; color: var(--accent); font-weight: 600; font-family: var(--font-head); }
.live-tag{
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ok);
  letter-spacing: .04em;
}
.live-tag::before{
  content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--ok);
  box-shadow: 0 0 7px 1px var(--ok); animation: pulse 2.2s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce){ .live-tag::before{ animation: none; } }

/* ---------- Competency rows ---------- */
.comp-row{ margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px dashed var(--border); }
.comp-row:last-child{ margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.comp-top{ display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; margin-bottom: 6px; }
.comp-top .name{ font-weight: 600; font-family: var(--font-head); font-size: 15px; }
.comp-top-right{ display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.comp-top .pct{ font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.comp-desc{ font-size: 12px; color: var(--text-faint); margin-bottom: 9px; }
.bar{ height: 7px; border-radius: 99px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
.bar-fill{
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent-strong), var(--accent));
  box-shadow: 0 0 10px -1px rgba(51,224,255,.7);
  transition: width .5s ease;
}
.update-form{ display: flex; gap: 8px; margin-top: 10px; }
.update-form input[type=number]{ width: 88px; }

.icon-btn{
  display: inline-flex; align-items: center; justify-content: center;
  width: 27px; height: 27px; border-radius: 6px;
  border: 1px solid var(--border-strong);
  background: transparent; color: var(--text-faint);
  cursor: pointer; transition: all .15s ease; flex-shrink: 0;
}
.icon-btn svg{ width: 13px; height: 13px; }
.icon-btn:hover{ color: var(--accent); border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px -3px rgba(51,224,255,.7); }
.icon-btn.danger:hover{ color: var(--bad); border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 0 10px -3px rgba(255,85,119,.7); }

.edit-form{ display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
.comp-row.editing .edit-form{ display: block; }
.comp-row.editing .update-form,
.comp-row.editing .comp-desc,
.comp-row.editing .bar{ display: none; }
.edit-form .field{ margin-bottom: 12px; }
.edit-form .form-actions{ margin-top: 2px; }

/* ---------- Table ---------- */
.table-wrap{ overflow-x: auto; }
table{ width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th{
  text-align: left;
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 600;
  font-family: var(--font-mono);
  letter-spacing: .04em;
  padding: 0 12px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td{
  padding: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text);
}
tbody tr:last-child td{ border-bottom: none; }
tbody tr{ transition: background .12s ease; }
tbody tr:hover{ background: var(--surface-hover); }
td.date, td.num{ font-family: var(--font-mono); color: var(--text-muted); font-size: 12.5px; }
.thumb{ width: 46px; height: 46px; object-fit: cover; border-radius: 7px; border: 1px solid var(--border-strong); }
.empty-cell{ color: var(--text-faint); text-align: center; padding: 30px 12px; }

/* ---------- Status badge ---------- */
.badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px 4px 7px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-mono);
}
.badge .dot{ width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.badge.ok{ background: var(--ok-soft); color: var(--ok); }
.badge.warn{ background: var(--warn-soft); color: var(--warn); }
.badge.warn .dot{ animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .badge.warn .dot{ animation: none; } }
.badge.bad{ background: var(--bad-soft); color: var(--bad); }

/* ---------- Forms ---------- */
.form-card{ max-width: 620px; }
.field{ margin-bottom: 16px; }
.field label{
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  font-family: var(--font-head);
  color: var(--text-muted);
  margin-bottom: 7px;
}
.field .hint{ font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }
input, select, textarea{
  width: 100%;
  background: var(--bg-soft);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13.5px;
  font-family: var(--font-ui);
  outline: none;
  transition: border-color .12s ease, box-shadow .12s ease;
}
input::placeholder, textarea::placeholder{ color: var(--text-faint); }
input:focus, select:focus, textarea:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea{ resize: vertical; min-height: 110px; font-family: var(--font-ui); }
input[type=file]{ padding: 8px 10px; cursor: pointer; }
input[type=date], input[type=number]{ font-family: var(--font-mono); }
.form-actions{ display: flex; gap: 10px; margin-top: 4px; }

/* ---------- Empty state ---------- */
.empty-state{
  text-align: center;
  padding: 46px 20px;
  color: var(--text-muted);
}
.empty-state svg{ width: 34px; height: 34px; color: var(--text-faint); margin-bottom: 12px; }
.empty-state p{ font-size: 13.5px; }

/* ---------- Chart card ---------- */
.chart-body{ display: flex; flex-direction: column; gap: 18px; align-items: center; }
.chart-wrap{
  position: relative; height: 232px; width: 232px; flex-shrink: 0;
  filter: drop-shadow(0 0 24px rgba(51,224,255,.16));
}
.chart-wrap::before{
  content: "";
  position: absolute; inset: -10px;
  border-radius: 50%;
  border: 1px dashed var(--border-strong);
  animation: spin 50s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .chart-wrap::before{ animation: none; } }
.chart-legend{
  list-style: none; margin: 0; padding: 0; width: 100%;
  display: flex; flex-direction: column; gap: 9px;
}
.chart-legend li{
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--text-muted);
  padding: 7px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-soft);
}
.chart-legend .dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.chart-legend .lbl{ flex: 1; font-family: var(--font-head); font-weight: 600; color: var(--text); }
.chart-legend .num{ font-family: var(--font-mono); color: var(--text-muted); font-weight: 600; }

/* ---------- Mobile ---------- */
@media (max-width: 920px){
  .shell{ grid-template-columns: 1fr; }
  .sidebar{
    position: static;
    height: auto;
    flex-direction: row;
    align-items: center;
    padding: 12px 16px;
    gap: 14px;
    overflow-x: auto;
  }
  .brand{ border-bottom: none; padding: 0; }
  .nav{ flex-direction: row; }
  .nav a{ border-left: none; border-bottom: 2px solid transparent; }
  .nav a.active{ border-bottom-color: var(--accent); }
  .nav-label{ display: none; }
  .sidebar-foot{ margin-top: 0; border-top: none; padding-top: 0; flex-direction: row; }
  .meta-line{ display: none; }
  .main{ padding: 20px 18px 50px; }
  .stat-grid{ grid-template-columns: repeat(2, 1fr); }
  .grid-2{ grid-template-columns: 1fr; }
}
@media (max-width: 520px){
  .stat-grid{ grid-template-columns: 1fr 1fr; }
  .stat-card .value{ font-size: 25px; }
}
</style>
</head>
<body>
<div id="scanline"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04141f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 9 13 13 21 4"/></svg>
      </div>
      <div class="brand-text">
        <strong>PKLTrack</strong>
        <span><i class="pulse-dot"></i>logbook.local</span>
      </div>
    </div>

    <nav class="nav" id="mainNav">
      <span class="nav-label">MENU</span>
      <a href="#/" data-route="#/">

        Dashboard
      </a>
      <a href="#/activities" data-route="#/activities">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4"/><circle cx="4.5" cy="12" r="1.4"/><circle cx="4.5" cy="18" r="1.4"/></svg>
        Kegiatan
      </a>
      <a href="#/competencies" data-route="#/competencies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        Kompetensi
      </a>
    </nav>

    <div class="sidebar-foot">
      <button class="pdf-btn" id="exportPdfBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Export laporan PDF
      </button>
      <span class="meta-line"><i class="pulse-dot"></i>data tersimpan lokal</span>
    </div>
  </aside>

  <main class="main">
    <div id="flash"></div>
    <div id="app"></div>
  </main>
</div>

<script>
/* ============================================================
   PKLTrack — static edition
   Aplikasi satu-file yang berjalan penuh di browser (cocok untuk
   GitHub Pages). Penyimpanan data memakai localStorage, dibungkus
   lewat sebuah lapisan "store" kecil supaya sisa kode tidak perlu
   tahu detailnya.
   ============================================================ */

// ---------------------------------------------------------------
// 1. STORE — pembungkus localStorage
// ---------------------------------------------------------------
const STORE_KEYS = {
  activities: "pkltrack_activities",
  competencies: "pkltrack_competencies"
};

const DEFAULT_COMPETENCIES = [
  { id: 1, name: "Monitoring jaringan", description: "Memantau koneksi dan aplikasi jaringan", progress: 80 },
  { id: 2, name: "Konfigurasi perangkat", description: "Mempelajari konfigurasi perangkat jaringan", progress: 60 },
  { id: 3, name: "Troubleshooting", description: "Menganalisis dan menangani gangguan", progress: 70 },
  { id: 4, name: "Dokumentasi teknis", description: "Membuat catatan dan laporan kegiatan", progress: 90 }
];

const Store = {
  getActivities(){
    return JSON.parse(localStorage.getItem(STORE_KEYS.activities) || "[]");
  },
  setActivities(list){
    localStorage.setItem(STORE_KEYS.activities, JSON.stringify(list));
  },
  getCompetencies(){
    const raw = localStorage.getItem(STORE_KEYS.competencies);
    if(!raw){
      localStorage.setItem(STORE_KEYS.competencies, JSON.stringify(DEFAULT_COMPETENCIES));
      return DEFAULT_COMPETENCIES.slice();
    }
    return JSON.parse(raw);
  },
  setCompetencies(list){
    localStorage.setItem(STORE_KEYS.competencies, JSON.stringify(list));
  },
  nextId(list){
    return list.length ? Math.max(...list.map(x => x.id)) + 1 : 1;
  }
};

// ---------------------------------------------------------------
// 2. HELPERS
// ---------------------------------------------------------------
function escapeHtml(str){
  const div = document.createElement("div");
  div.innerText = str == null ? "" : str;
  return div.innerHTML;
}
function escapeAttr(str){
  return escapeHtml(str).replace(/"/g, "&quot;");
}

function formatDateShort(iso){
  if(!iso) return "-";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}-${m}-${y}`;
}

function flash(message, category){
  const el = document.getElementById("flash");
  el.innerHTML = `<div class="alert alert-${category}">${escapeHtml(message)}</div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.innerHTML = ""; }, 3800);
}

function statusBadge(status){
  const map = {
    "Selesai": { cls: "ok", label: "Selesai" },
    "Diproses": { cls: "warn", label: "Diproses" },
    "Belum": { cls: "bad", label: "Belum" }
  };
  const s = map[status] || { cls: "warn", label: status };
  return `<span class="badge ${s.cls}"><span class="dot"></span>${escapeHtml(s.label)}</span>`;
}

function iconEmpty(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`;
}
function iconEdit(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
}
function iconTrash(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>`;
}

const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function animateCountUp(root){
  const nodes = root.querySelectorAll("[data-target]");
  nodes.forEach(el => {
    const target = parseFloat(el.dataset.target) || 0;
    const suffix = el.dataset.suffix || "";
    if(prefersReducedMotion){ el.textContent = target + suffix; return; }
    const duration = 650;
    const startTime = performance.now();
    function step(now){
      const p = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// ---------------------------------------------------------------
// 3. CHART instance tracker (Chart.js keeps state between renders)
// ---------------------------------------------------------------
let statusChart = null;

const centerTextPlugin = {
  id: "centerText",
  afterDraw(chart){
    const { ctx, chartArea } = chart;
    if(!chartArea) return;
    const data = chart.data.datasets[0].data;
    const total = data.reduce((a, b) => a + b, 0);
    const done = data[0] || 0;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const cx = (chartArea.left + chartArea.right) / 2;
    const cy = (chartArea.top + chartArea.bottom) / 2;
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if(total){
      ctx.shadowColor = "rgba(51,224,255,.7)";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#33e0ff";
      ctx.font = "700 30px Orbitron, sans-serif";
      ctx.fillText(pct + "%", cx, cy - 9);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#7f8fb8";
      ctx.font = "600 10.5px 'JetBrains Mono', monospace";
      ctx.fillText("SELESAI", cx, cy + 16);
    } else {
      ctx.fillStyle = "#5b6786";
      ctx.font = "600 12px 'JetBrains Mono', monospace";
      ctx.fillText("BELUM ADA DATA", cx, cy);
    }
    ctx.restore();
  }
};

// ---------------------------------------------------------------
// 4. VIEWS
// ---------------------------------------------------------------
function viewDashboard(){
  const activities = Store.getActivities();
  const competencies = Store.getCompetencies();

  const total = activities.length;
  const done = activities.filter(a => a.status === "Selesai").length;
  const process = activities.filter(a => a.status === "Diproses").length;
  const pending = activities.filter(a => a.status === "Belum").length;
  const avgComp = competencies.length
    ? Math.round(competencies.reduce((sum, c) => sum + c.progress, 0) / competencies.length)
    : 0;

  const recent = [...activities]
    .sort((a, b) => (b.activity_date + b.id).localeCompare(a.activity_date + a.id))
    .slice(0, 5);

  const compHtml = competencies.length
    ? competencies.map(c => `
      <div class="comp-row">
        <div class="comp-top"><span class="name">${escapeHtml(c.name)}</span><span class="pct">${c.progress}%</span></div>
        <div class="bar"><div class="bar-fill" style="width:${c.progress}%"></div></div>
      </div>
    `).join("")
    : `<div class="empty-state"><p>Belum ada kompetensi tercatat.</p></div>`;

  const rowsHtml = recent.length
    ? recent.map(a => `
      <tr>
        <td class="date">${formatDateShort(a.activity_date)}</td>
        <td>${escapeHtml(a.title)}</td>
        <td>${statusBadge(a.status)}</td>
      </tr>
    `).join("")
    : `<tr><td colspan="3" class="empty-cell">Belum ada kegiatan yang tercatat.</td></tr>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Dashboard PKL</h1>
        <p class="sub">Ringkasan kegiatan dan perkembangan kompetensi selama praktik kerja lapangan.</p>
      </div>
      <a href="#/activities/add" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Tambah kegiatan
      </a>
    </div>

    <div class="stat-grid">
      <div class="stat-card k-total"><div class="label"><span class="dot"></span>Total kegiatan</div><div class="value" data-target="${total}">0</div></div>
      <div class="stat-card k-ok"><div class="label"><span class="dot"></span>Selesai</div><div class="value ok" data-target="${done}">0</div></div>
      <div class="stat-card k-warn"><div class="label"><span class="dot"></span>Diproses</div><div class="value warn" data-target="${process}">0</div></div>
      <div class="stat-card k-violet"><div class="label"><span class="dot"></span>Rata-rata kompetensi</div><div class="value accent" data-target="${avgComp}" data-suffix="%">0%</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Distribusi status kegiatan</h3><span class="live-tag">live</span></div>
        <div class="chart-body">
          <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
          <ul class="chart-legend" id="chartLegend"></ul>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Progres kompetensi</h3></div>
        ${compHtml}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Kegiatan terbaru</h3>
        <a href="#/activities">Lihat semua &rsaquo;</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Status</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;

  animateCountUp(document.querySelector(".stat-grid"));

  const legendData = [
    { label: "Selesai", value: done, color: "#2ee6a6" },
    { label: "Diproses", value: process, color: "#ffb547" },
    { label: "Belum", value: pending, color: "#ff5577" }
  ];
  document.getElementById("chartLegend").innerHTML = legendData.map(d => `
    <li><span class="dot" style="background:${d.color};box-shadow:0 0 8px ${d.color}"></span><span class="lbl">${d.label}</span><span class="num">${d.value}</span></li>
  `).join("");

  if(statusChart) statusChart.destroy();
  const ctx = document.getElementById("statusChart");
  statusChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Selesai", "Diproses", "Belum"],
      datasets: [{
        data: [done, process, pending],
        backgroundColor: ["#2ee6a6", "#ffb547", "#ff5577"],
        borderColor: "#0d1220",
        borderWidth: 3,
        hoverOffset: 8,
        borderRadius: 4
      }]
    },
    options: {
      maintainAspectRatio: false,
      cutout: "74%",
      animation: { animateRotate: true, duration: prefersReducedMotion ? 0 : 900, easing: "easeOutCubic" },
      plugins: { legend: { display: false }, tooltip: { titleFont: { family: "Rajdhani" }, bodyFont: { family: "JetBrains Mono" } } }
    },
    plugins: [centerTextPlugin]
  });
}

function viewActivities(){
  const activities = [...Store.getActivities()]
    .sort((a, b) => (b.activity_date + b.id).localeCompare(a.activity_date + a.id));

  const rows = activities.length
    ? activities.map(a => {
        const desc = a.description.length > 70
          ? escapeHtml(a.description.slice(0, 70)) + "…"
          : escapeHtml(a.description);
        const photo = a.photo
          ? `<img src="${a.photo}" class="thumb" alt="Dokumentasi ${escapeHtml(a.title)}">`
          : `<span class="empty-cell" style="padding:0;">—</span>`;
        return `
          <tr>
            <td class="date">${formatDateShort(a.activity_date)}</td>
            <td>${escapeHtml(a.title)}</td>
            <td style="color:var(--text-muted)">${desc}</td>
            <td>${statusBadge(a.status)}</td>
            <td>${photo}</td>
            <td><button class="btn btn-danger btn-sm" onclick="Actions.deleteActivity(${a.id})">Hapus</button></td>
          </tr>`;
      }).join("")
    : `<tr><td colspan="6" class="empty-cell">Belum ada kegiatan yang tercatat.</td></tr>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Kegiatan harian</h1>
        <p class="sub">${activities.length} kegiatan tercatat sejauh ini.</p>
      </div>
      <a href="#/activities/add" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Tambah kegiatan
      </a>
    </div>
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Deskripsi</th><th>Status</th><th>Foto</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function viewActivityForm(){
  const today = new Date().toISOString().slice(0, 10);

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Tambah kegiatan PKL</h1>
        <p class="sub">Catat apa yang kamu kerjakan hari ini.</p>
      </div>
    </div>
    <div class="panel form-card">
      <form id="activityForm">
        <div class="field">
          <label for="f_date">Tanggal</label>
          <input id="f_date" type="date" name="activity_date" value="${today}" required>
        </div>
        <div class="field">
          <label for="f_title">Nama kegiatan</label>
          <input id="f_title" name="title" placeholder="Contoh: Monitoring jaringan" required>
        </div>
        <div class="field">
          <label for="f_desc">Deskripsi</label>
          <textarea id="f_desc" name="description" placeholder="Jelaskan kegiatan yang dilakukan..." required></textarea>
        </div>
        <div class="field">
          <label for="f_status">Status</label>
          <select id="f_status" name="status">
            <option>Selesai</option>
            <option>Diproses</option>
            <option>Belum</option>
          </select>
        </div>
        <div class="field">
          <label for="f_photo">Foto dokumentasi</label>
          <input id="f_photo" type="file" name="photo" accept=".png,.jpg,.jpeg,.webp">
          <p class="hint">Opsional. Format PNG, JPG, JPEG, atau WEBP.</p>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Simpan kegiatan</button>
          <a href="#/activities" class="btn btn-ghost">Batal</a>
        </div>
      </form>
    </div>
  `;

  document.getElementById("activityForm").addEventListener("submit", Actions.submitActivity);
}

function viewCompetencies(){
  const competencies = Store.getCompetencies();

  const listHtml = competencies.length
    ? competencies.map(c => `
      <div class="comp-row" data-id="${c.id}">
        <div class="comp-top">
          <span class="name">${escapeHtml(c.name)}</span>
          <div class="comp-top-right">
            <span class="pct">${c.progress}%</span>
            <button class="icon-btn" type="button" title="Edit kompetensi" onclick="Actions.toggleEditCompetency(${c.id})">${iconEdit()}</button>
            <button class="icon-btn danger" type="button" title="Hapus kompetensi" onclick="Actions.deleteCompetency(${c.id})">${iconTrash()}</button>
          </div>
        </div>
        <div class="comp-desc">${escapeHtml(c.description || "")}</div>
        <div class="bar"><div class="bar-fill" style="width:${c.progress}%"></div></div>
        <form class="update-form" data-id="${c.id}" onsubmit="Actions.updateCompetency(event)">
          <input type="number" min="0" max="100" name="progress" value="${c.progress}">
          <button class="btn btn-ghost btn-sm" type="submit">Update progres</button>
        </form>
        <form class="edit-form" data-id="${c.id}" onsubmit="Actions.saveEditCompetency(event)">
          <div class="field">
            <label>Nama kompetensi</label>
            <input name="name" value="${escapeAttr(c.name)}" required>
          </div>
          <div class="field">
            <label>Deskripsi</label>
            <textarea name="description">${escapeHtml(c.description || "")}</textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" type="submit">Simpan perubahan</button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="Actions.toggleEditCompetency(${c.id})">Batal</button>
          </div>
        </form>
      </div>
    `).join("")
    : `<div class="empty-state">${iconEmpty()}<p>Belum ada kompetensi tercatat.</p></div>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Kompetensi PKL</h1>
        <p class="sub">Catat kemampuan yang sudah kamu pelajari selama praktik. Salah tulis? Tinggal klik edit atau hapus.</p>
      </div>
    </div>
    <div class="grid-2">
      <div class="panel">${listHtml}</div>
      <div class="panel">
        <div class="panel-head"><h3>Tambah kompetensi</h3></div>
        <form id="addCompForm">
          <div class="field">
            <label for="c_name">Nama kompetensi</label>
            <input id="c_name" name="name" placeholder="Contoh: Instalasi kabel jaringan" required>
          </div>
          <div class="field">
            <label for="c_desc">Deskripsi</label>
            <textarea id="c_desc" name="description" placeholder="Deskripsi singkat"></textarea>
          </div>
          <div class="field">
            <label for="c_progress">Progres awal (%)</label>
            <input id="c_progress" type="number" name="progress" min="0" max="100" value="0">
          </div>
          <button class="btn btn-primary" type="submit">Tambah kompetensi</button>
        </form>
      </div>
    </div>
  `;

  document.getElementById("addCompForm").addEventListener("submit", Actions.addCompetency);
}

// ---------------------------------------------------------------
// 5. ACTIONS — mutate the store, then re-render
// ---------------------------------------------------------------
const Actions = {
  deleteActivity(id){
    if(!confirm("Hapus kegiatan ini?")) return;
    const list = Store.getActivities().filter(a => a.id !== id);
    Store.setActivities(list);
    flash("Kegiatan dihapus.", "success");
    viewActivities();
  },

  submitActivity(e){
    e.preventDefault();
    const form = e.target;
    const activity_date = form.activity_date.value;
    const title = form.title.value.trim();
    const description = form.description.value.trim();
    const status = form.status.value;
    const file = form.photo.files[0];
    const allowedExt = ["png", "jpg", "jpeg", "webp"];

    function persist(photoDataUrl){
      const list = Store.getActivities();
      list.push({
        id: Store.nextId(list),
        activity_date, title, description, status,
        photo: photoDataUrl || null,
        created_at: new Date().toISOString()
      });
      Store.setActivities(list);
      flash("Kegiatan berhasil ditambahkan.", "success");
      location.hash = "#/activities";
    }

    if(file){
      const ext = file.name.split(".").pop().toLowerCase();
      if(!allowedExt.includes(ext)){
        flash("Format foto harus PNG, JPG, JPEG, atau WEBP.", "danger");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => persist(reader.result);
      reader.readAsDataURL(file);
    } else {
      persist(null);
    }
  },

  updateCompetency(e){
    e.preventDefault();
    const form = e.target;
    const id = parseInt(form.dataset.id, 10);
    let progress = parseInt(form.progress.value, 10) || 0;
    progress = Math.max(0, Math.min(100, progress));
    const list = Store.getCompetencies();
    const item = list.find(c => c.id === id);
    if(item) item.progress = progress;
    Store.setCompetencies(list);
    flash("Progres diperbarui.", "success");
    viewCompetencies();
  },

  addCompetency(e){
    e.preventDefault();
    const form = e.target;
    const name = form.name.value.trim();
    const description = form.description.value.trim();
    let progress = parseInt(form.progress.value, 10) || 0;
    progress = Math.max(0, Math.min(100, progress));
    if(!name) return;
    const list = Store.getCompetencies();
    list.push({ id: Store.nextId(list), name, description, progress });
    Store.setCompetencies(list);
    flash("Kompetensi ditambahkan.", "success");
    viewCompetencies();
  },

  toggleEditCompetency(id){
    const row = document.querySelector(`.comp-row[data-id="${id}"]`);
    if(row) row.classList.toggle("editing");
  },

  saveEditCompetency(e){
    e.preventDefault();
    const form = e.target;
    const id = parseInt(form.dataset.id, 10);
    const name = form.name.value.trim();
    const description = form.description.value.trim();
    if(!name) return;
    const list = Store.getCompetencies();
    const item = list.find(c => c.id === id);
    if(item){ item.name = name; item.description = description; }
    Store.setCompetencies(list);
    flash("Kompetensi diperbarui.", "success");
    viewCompetencies();
  },

  deleteCompetency(id){
    if(!confirm("Hapus kompetensi ini? Tindakan ini tidak bisa dibatalkan.")) return;
    const list = Store.getCompetencies().filter(c => c.id !== id);
    Store.setCompetencies(list);
    flash("Kompetensi dihapus.", "success");
    viewCompetencies();
  }
};

// ---------------------------------------------------------------
// 6. PDF EXPORT
// ---------------------------------------------------------------
function exportPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "cm", format: "a4" });
  const activities = [...Store.getActivities()].sort((a, b) => b.activity_date.localeCompare(a.activity_date));
  const competencies = Store.getCompetencies();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = 2;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.text("PKLTrack — Laporan Dokumentasi PKL", 2, y);
  y += 0.8;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  doc.text(`Dibuat pada: ${stamp}`, 2, y);
  y += 1.2;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.text("Daftar Kompetensi", 2, y);
  y += 0.6;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  competencies.forEach(item => {
    doc.text(`- ${item.name}: ${item.progress}%`, 2.2, y);
    y += 0.45;
  });

  y += 0.4;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.text("Kegiatan PKL", 2, y);
  y += 0.6;
  doc.setFontSize(9);

  if(activities.length === 0){
    doc.setFont("helvetica", "normal");
    doc.text("Belum ada kegiatan yang tercatat.", 2.2, y);
  }

  activities.forEach(item => {
    if(y > pageHeight - 3){
      doc.addPage();
      y = 2;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
    }
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text(`${item.activity_date} | ${item.title} | ${item.status}`, 2.2, y);
    y += 0.4;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    const description = item.description || "";
    for(let i = 0; i < description.length; i += 95){
      if(y > pageHeight - 2){
        doc.addPage();
        y = 2;
      }
      doc.text(description.slice(i, i + 95), 2.5, y);
      y += 0.35;
    }
    y += 0.25;
  });

  doc.save("laporan_pkltrack.pdf");
}
document.getElementById("exportPdfBtn").addEventListener("click", exportPdf);

// ---------------------------------------------------------------
// 7. ROUTER
// ---------------------------------------------------------------
const ROUTES = {
  "#/": viewDashboard,
  "#/activities": viewActivities,
  "#/activities/add": viewActivityForm,
  "#/competencies": viewCompetencies
};

function setActiveNav(hash){
  document.querySelectorAll("#mainNav a").forEach(a => {
    a.classList.toggle("active", a.dataset.route === hash);
  });
}

function route(){
  const hash = location.hash || "#/";
  const view = ROUTES[hash] || viewDashboard;
  const navHash = hash === "#/activities/add" ? "#/activities" : hash;
  setActiveNav(navHash);
  view();
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
</script>
</body>
</html>
