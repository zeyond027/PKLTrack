<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PKLTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{background:#0f172a;color:#e2e8f0}.navbar,.card{background:#1e293b!important;border-color:#334155!important}
    .text-muted{color:#94a3b8!important}.table{--bs-table-bg:#1e293b;--bs-table-color:#e2e8f0}
    .form-control,.form-select{background:#0f172a;color:#e2e8f0;border-color:#475569}
    .form-control:focus,.form-select:focus{background:#0f172a;color:#fff}
    .progress{background:#334155}.brand{color:#60a5fa!important;font-weight:700}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand brand" href="/">PKLTrack</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/activities">Kegiatan</a>
      <a class="nav-link" href="/competencies">Kompetensi</a>
      <a class="nav-link" href="/report/pdf">Export PDF</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{category}}">{{message}}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
